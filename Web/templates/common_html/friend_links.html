{% if friend_links %}
<style>
.fl-box{width:100%;background:#f7f8fa;border-top:1px solid #e8eaed;box-sizing:border-box;}
.fl-inner{max-width:1200px;margin:0 auto;padding:24px 20px;box-sizing:border-box;}
.fl-title{display:inline-block;color:#333;font-size:14px;font-weight:700;margin-right:16px;line-height:1.8;}
.fl-box a.fl-link{color:#2a6fd6;text-decoration:none;font-size:13px;margin-right:20px;line-height:1.8;white-space:nowrap;}
.fl-box a.fl-link:hover{color:#d61518;text-decoration:underline;}
</style>
<div class="fl-box">
    <div class="fl-inner">
        <span class="fl-title">友情链接：</span>
        {% for link in friend_links %}
        <a class="fl-link" href="{{ link.url }}" target="_blank" rel="noopener">{{ link.name }}</a>
        {% endfor %}
    </div>
</div>
{% endif %}
